version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: baza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-baza_pass}
      POSTGRES_DB: ${DB_NAME:-baza_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - baza_pgdata:/var/lib/postgresql/data

volumes:
  baza_pgdata:
